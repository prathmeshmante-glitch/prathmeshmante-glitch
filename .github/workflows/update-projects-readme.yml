name: Refresh profile projects

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/update-projects-readme.yml"

permissions:
  contents: write

jobs:
  refresh-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update public project list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: prathmeshmante-glitch
          PROFILE_REPO: prathmeshmante-glitch
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          username = os.environ["GH_USERNAME"]
          profile_repo = os.environ["PROFILE_REPO"]
          token = os.environ["GH_TOKEN"]

          repos = []
          page = 1
          while True:
              url = f"https://api.github.com/users/{username}/repos?type=owner&sort=updated&per_page=100&page={page}"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "profile-projects-updater"
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)
              if not batch:
                  break
              repos.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          public_repos = [
              repo for repo in repos
              if not repo.get("private")
              and not repo.get("fork")
              and repo["name"].lower() != profile_repo.lower()
          ]

          rows = []
          if public_repos:
              rows.append("| Repository | Description | Language | Updated |")
              rows.append("|---|---|---|---|")
              for repo in public_repos:
                  name = repo["name"].replace("|", "\\|")
                  description = (repo.get("description") or "No description added yet.").replace("|", "\\|").replace("\n", " ")
                  if len(description) > 140:
                      description = description[:137].rstrip() + "..."
                  language = repo.get("language") or "—"
                  updated = (repo.get("updated_at") or "")[:10] or "—"
                  rows.append(f"| [{name}]({repo['html_url']}) | {description} | {language} | {updated} |")
          else:
              rows.append("No public project repositories found yet. [Browse all repositories](https://github.com/" + username + "?tab=repositories).")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"
          if start not in readme or end not in readme:
              raise SystemExit("Project section markers are missing from README.md.")
          before, rest = readme.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = "\n" + "\n".join(rows) + "\n"
          updated_readme = before + start + replacement + end + after
          if updated_readme != readme:
              readme_path.write_text(updated_readme, encoding="utf-8")
              print(f"Updated README with {len(public_repos)} public repositories.")
          else:
              print(f"Project list is already current ({len(public_repos)} repositories).")
          PY

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No project-list changes to commit."
          else
            git commit -m "chore(profile): refresh public projects list"
            git push
          fi
